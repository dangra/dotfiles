  mods = "Command"

[[keyboard.bindings]]
  chars = "\u00019"
  key = "Key9"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001H"
  key = "Left"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001J"
  key = "Down"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001K"
  key = "Up"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001L"
  key = "Right"
  mods = "Command"

[[mouse.bindings]]
  action = "PasteSelection"
  mouse = "Middle"

[selection]
  save_to_clipboard = true

[terminal.shell]
  args = ["-lc", "exec tmux new"]
  program = "bash"

[window]
  decorations = "buttonless"
  opacity = 0.95

[general]
  live_config_reload = true
  #import = ["~/.config/alacritty/themes/tokyonight-night.toml"]
  import = ["~/.config/alacritty/themes/monokai_pro.toml"]

