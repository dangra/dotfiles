
[font]
  size = 14.0

  [font.normal]
    #family = "Inconsolata Nerd Font"
    #family = "Iosevka Nerd Font"
    family = "FiraCode Nerd Font"
    #family = "Menlo"
    #family = "Iosevka Nerd Font"

[[keyboard.bindings]]
  action = "ToggleSimpleFullscreen"
  key = "Return"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001\""
  key = "D"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001%"
  key = "D"
  mods = "Command|Shift"

[[keyboard.bindings]]
  chars = "\u0001x"
  key = "W"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001h"
  key = "H"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001j"
  key = "J"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001k"
  key = "K"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001l"
  key = "L"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001H"
  key = "H"
  mods = "Command|Shift"

[[keyboard.bindings]]
  chars = "\u0001J"
  key = "J"
  mods = "Command|Shift"

