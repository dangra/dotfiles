  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001n"
  key = "RBracket"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001p"
  key = "LBracket"
  mods = "Command"

[[keyboard.bindings]]
  chars = "\u0001z"
